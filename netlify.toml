# Netlify configuration for ServEaso Booking App
[build]
  # Build command - use regular build, env vars set in Netlify UI
  command = "npm run build"
  # Output directory
  publish = "build"

# Environment variables
[build.environment]
  NODE_VERSION = "20"
  CI = "false"  # Treat warnings as warnings, not errors

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for iframe embedding
[[headers]]
  for = "/*"
  [headers.values]
    # Allow embedding in iframes from any origin (for Netlify previews and custom domains)
    Content-Security-Policy = "frame-ancestors *"
    X-Content-Type-Options = "nosniff"
    
# CORS headers for API calls
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.serveaso.com"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Credentials = "true"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
